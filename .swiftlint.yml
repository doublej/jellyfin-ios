excluded:
  - .build
  - Packages

function_body_length:
  warning: 20
  error: 40

# Short names that are the domain's own: coordinates, the server's field names (Pw, Id), quality labels.
identifier_name:
  excluded: [x, y, id, ok, sd, hd, pw, on]

# A key map is one flat switch; its cases are not branches worth splitting.
cyclomatic_complexity:
  ignores_case_statements: true

# Settings enums nest inside the struct they configure.
nesting:
  type_level: 2

# `UI` is the UI-test helper namespace.
type_name:
  excluded: [UI]

file_length:
  warning: 300
  error: 400

custom_rules:
  bare_nsapp_activate:
    name: "Ineffective NSApp.activate()"
    # macOS 14 cooperative activation: a background or accessory app is never yielded
    # activation, so this call silently does nothing and the window opens behind other
    # apps. See AppActivation.swift for the measurements.
    regex: '\bNSApp(lication\.shared)?\.activate\(\s*\)'
    message: "NSApp.activate() is a no-op for a background/LSUIElement app — use AppActivation.front()"
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment

disabled_rules:
  - todo
  - line_length
